<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NESエミュレータ開発のはじめかた</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- Highlight.js Rust support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/rust.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #fff; }
        
        /* Sidebar styling */
        #sidebar { 
            width: 300px; background: #f6f8fa; border-right: 1px solid #e1e4e8; 
            overflow-y: auto; padding: 20px 10px; box-sizing: border-box; 
        }
        #sidebar h2 { font-size: 1.2em; color: #24292e; margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid #e1e4e8; text-align: center; }
        .chapter { margin-bottom: 12px; }
        .chapter-title { font-weight: 600; font-size: 0.95em; color: #586069; margin-bottom: 4px; padding-left: 8px; }
        .file-list { list-style: none; padding: 0; margin: 0; }
        .file-list li { margin: 2px 0; }
        .file-list a { 
            text-decoration: none; color: #0366d6; font-size: 0.9em; 
            display: block; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: background-color 0.2s;
        }
        .file-list a:hover { background: #eaecef; }
        .file-list a.active { background: #0366d6; color: #fff; font-weight: 600; }
        
        /* Content area styling */
        #content-wrapper { flex: 1; overflow-y: auto; padding: 40px; box-sizing: border-box; }
        #content { max-width: 860px; margin: 0 auto; line-height: 1.7; color: #24292e; font-size: 16px; padding-bottom: 100px; }
        
        /* Markdown generated HTML styles */
        #content h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 0; }
        #content h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 24px; }
        #content h3 { font-size: 1.25em; margin-top: 24px; }
        #content p { margin-top: 0; margin-bottom: 16px; }
        #content code { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 85%; background-color: rgba(27,31,35,0.05); border-radius: 3px; padding: 0.2em 0.4em; }
        #content pre { background-color: #f6f8fa; border-radius: 6px; padding: 16px; overflow: auto; line-height: 1.45; font-size: 85%; border: 1px solid #e1e4e8; }
        #content pre code { background-color: transparent; padding: 0; border: 0; }
        #content blockquote { padding: 0 1em; color: #6a737d; border-left: 0.25em solid #dfe2e5; margin: 0 0 16px 0; }
        #content img { max-width: 100%; box-sizing: content-box; border-radius: 6px; }
        #content table { border-spacing: 0; border-collapse: collapse; margin-bottom: 16px; width: 100%; }
        #content th, #content td { padding: 6px 13px; border: 1px solid #dfe2e5; }
        #content th { font-weight: 600; background-color: #f6f8fa; }
        #content hr { height: 0.25em; padding: 0; margin: 24px 0; background-color: #e1e4e8; border: 0; }
        
        .loading { text-align: center; color: #586069; padding: 50px; font-style: italic; }
        .error { color: #cb2431; background-color: #ffeef0; padding: 20px; border-radius: 6px; border: 1px solid #f8aab1; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>NES Guide<br><span style="font-size: 0.6em; color: #586069;">エミュレータ開発のはじめかた</span></h2>
        <div id="nav-container"></div>
    </div>

    <div id="content-wrapper">
        <div id="content">
            <div style="text-align: center; margin-top: 100px; color: #586069;">
                <h2>左側のメニューからセクションを選択してください</h2>
                <p>※注意: ローカルファイルからアクセスしている場合、ブラウザのセキュリティ制限(CORS)によりファイルが読み込めないことがあります。<br>その場合は <code>python3 -m http.server</code> などのローカルサーバー経由で開いてください。</p>
            </div>
        </div>
    </div>

    <script>
        // Configure marked.js to use highlight.js for code blocks
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        // Define the chapters and files
        const TOC = [
            {
                title: "1. CPUと基礎",
                files: [
                    { id: "HOWTOMAKE_1_1", name: "1-1: エミュレータの構造とCPU" },
                    { id: "HOWTOMAKE_1_2", name: "1-2: サイクルとTDD" }
                ]
            },
            {
                title: "2. レジスタとアドレッシング",
                files: [
                    { id: "HOWTOMAKE_2_1", name: "2-1: 6502の引き出し" },
                    { id: "HOWTOMAKE_2_2", name: "2-2: アドレッシング・モード" }
                ]
            },
            {
                title: "3. NESアーキテクチャ",
                files: [
                    { id: "HOWTOMAKE_3_1", name: "3-1: システムバスとI/O" },
                    { id: "HOWTOMAKE_3_2", name: "3-2: 時間の同期" }
                ]
            },
            {
                title: "4. 命令と分岐",
                files: [
                    { id: "HOWTOMAKE_4_1", name: "4-1: TAX, ADC" },
                    { id: "HOWTOMAKE_4_2", name: "4-2: 分岐(BEQ)とフラグ" }
                ]
            },
            {
                title: "5. PPU(映像)の基礎",
                files: [
                    { id: "HOWTOMAKE_5_1", name: "5-1: VRAMとネームテーブル" },
                    { id: "HOWTOMAKE_5_2", name: "5-2: PPUポートとDMA" }
                ]
            },
            {
                title: "6. 走査線とNMI",
                files: [
                    { id: "HOWTOMAKE_6_1", name: "6-1: スキャンライン" },
                    { id: "HOWTOMAKE_6_2", name: "6-2: NMI(目覚まし時計)" }
                ]
            },
            {
                title: "7. コントローラと入力",
                files: [
                    { id: "HOWTOMAKE_7_1", name: "7-1: シフトレジスタ" },
                    { id: "HOWTOMAKE_7_2", name: "7-2: Joypad実装" }
                ]
            },
            {
                title: "8. 容量の壁(マッパー)",
                files: [
                    { id: "HOWTOMAKE_8_1", name: "8-1: バンク切り替え" },
                    { id: "HOWTOMAKE_8_2", name: "8-2: MMC1の実装" }
                ]
            },
            {
                title: "9. APUと音声",
                files: [
                    { id: "HOWTOMAKE_9_1", name: "9-1: 音の波形" },
                    { id: "HOWTOMAKE_9_2", name: "9-2: ミキシング" }
                ]
            },
            {
                title: "A. スクロールの壁",
                files: [
                    { id: "HOWTOMAKE_A_1", name: "A-1: PPUスクロール" },
                    { id: "HOWTOMAKE_A_2", name: "A-2: Loopy Register" }
                ]
            },
            {
                title: "B. VRAMの壁",
                files: [
                    { id: "HOWTOMAKE_B_1", name: "B-1: VRAMミラーリング" },
                    { id: "HOWTOMAKE_B_2", name: "B-2: H/Vミラーリング実装" }
                ]
            },
            {
                title: "C. ロム解読の壁",
                files: [
                    { id: "HOWTOMAKE_C_1", name: "C-1: iNESフォーマット" },
                    { id: "HOWTOMAKE_C_2", name: "C-2: Romローダー実装" }
                ]
            },
            {
                title: "D. 関数の壁",
                files: [
                    { id: "HOWTOMAKE_D_1", name: "D-1: ハードウェア・スタック" },
                    { id: "HOWTOMAKE_D_2", name: "D-2: サブルーチン(JSR/RTS)" }
                ]
            },
            {
                title: "E. 描画ループの壁",
                files: [
                    { id: "HOWTOMAKE_E_1", name: "E-1: PPUの8サイクル" },
                    { id: "HOWTOMAKE_E_2", name: "E-2: スプライトとシフト回路" }
                ]
            }
        ];

        // 1. Render Sidebar
        const navContainer = document.getElementById('nav-container');
        TOC.forEach(chapter => {
            const chapDiv = document.createElement('div');
            chapDiv.className = 'chapter';
            
            const chapTitle = document.createElement('div');
            chapTitle.className = 'chapter-title';
            chapTitle.textContent = chapter.title;
            chapDiv.appendChild(chapTitle);
            
            const ul = document.createElement('ul');
            ul.className = 'file-list';
            
            chapter.files.forEach(file => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.textContent = file.name;
                a.setAttribute('data-id', file.id);
                a.onclick = (e) => loadMarkdown(file.id, e.target);
                li.appendChild(a);
                ul.appendChild(li);
            });
            
            chapDiv.appendChild(ul);
            navContainer.appendChild(chapDiv);
        });

        // 2. Load Markdown File
        async function loadMarkdown(fileId, linkElement) {
            // Update active state in sidebar
            document.querySelectorAll('.file-list a').forEach(a => a.classList.remove('active'));
            if (linkElement) linkElement.classList.add('active');

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">ファイルを読み込み中...</div>';

            try {
                // Fetch the Markdown file
                const response = await fetch(`./${fileId}.md`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const markdownText = await response.text();
                
                // Parse and render
                contentDiv.innerHTML = marked.parse(markdownText);
                
                // Scroll to top
                document.getElementById('content-wrapper').scrollTop = 0;
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <h3>読み込みエラー</h3>
                        <p>ファイル <code>${fileId}.md</code> の読み込みに失敗しました。</p>
                        <p>理由: ${error.message}</p>
                        <p><strong>CORSエラーの場合:</strong> ローカルファイル (file://) から直接開いていると、セキュリティポリシーにより他のファイルを読み込めません。<br>
                        ターミナルで <code>python3 -m http.server</code> を実行し、<code>http://localhost:8000/guide.html</code> にアクセスしてください。</p>
                    </div>
                `;
            }
        }

        // 3. Load first file on startup or handle hash
        window.onload = () => {
            const defaultId = TOC[0].files[0].id;
            const firstLink = document.querySelector(`a[data-id="${defaultId}"]`);
            loadMarkdown(defaultId, firstLink);
        };
    </script>
</body>
</html>
